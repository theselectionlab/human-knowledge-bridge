<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Diagram: the ground moves, the sensor records a line, and scientists study the signal.">
  <rect width="400" height="250" rx="12" fill="#16243d"/>
  <!-- panel 1: ground moves -->
  <g transform="translate(20,28)">
    <rect x="0" y="118" width="100" height="46" rx="6" fill="#0b1526" stroke="#6b90c6" stroke-width="1.5"/>
    <path d="M12 141 q10 -12 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#7ee0b8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="35" cy="141" r="3" fill="#ffd166"/>
  </g>
  <!-- arrow -->
  <path d="M130 118 h26" stroke="#6b90c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M152 112 l8 6 -8 6" fill="none" stroke="#6b90c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- panel 2: sensor records -->
  <g transform="translate(170,28)">
    <rect x="0" y="70" width="90" height="94" rx="8" fill="#0b1526" stroke="#6b90c6" stroke-width="1.5"/>
    <circle cx="45" cy="96" r="10" fill="none" stroke="#8fc4ff" stroke-width="2"/>
    <circle cx="45" cy="96" r="3.5" fill="#8fc4ff"/>
    <path d="M30 132 q7 -14 15 0 t15 0 t15 0" fill="none" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- arrow -->
  <path d="M268 118 h26" stroke="#6b90c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M290 112 l8 6 -8 6" fill="none" stroke="#6b90c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- panel 3: scientists study -->
  <g transform="translate(308,28)">
    <rect x="0" y="58" width="72" height="106" rx="8" fill="#0b1526" stroke="#6b90c6" stroke-width="1.5"/>
    <path d="M10 132 l12 -22 10 12 10 -30 10 22 10 -12" fill="none" stroke="#f2c46d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
