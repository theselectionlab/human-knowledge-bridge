<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Three labels on one beam: measured evidence, scientific conclusion, and scientific model. An open question sits apart, inside a cloud.">
  <rect width="640" height="200" rx="12" fill="#16243d"/>
  <!-- central stand, not a balance: one beam, three places -->
  <path d="M320 40 v96" stroke="#6b90c6" stroke-width="3" stroke-linecap="round"/>
  <path d="M290 152 h60" stroke="#6b90c6" stroke-width="3" stroke-linecap="round"/>
  <path d="M232 40 h176" stroke="#6b90c6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="320" cy="40" r="6" fill="#6b90c6"/>

  <!-- measured -->
  <g transform="translate(120,20)">
    <rect x="-58" y="0" width="116" height="64" rx="10" fill="#223b4c" stroke="#7ee0b8" stroke-width="2"/>
    <path d="M-26 44 h52" stroke="#7ee0b8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-18 44 v-10m12 10v-18m12 18v-8m12 8v-16m12 16v-12" stroke="#7ee0b8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M58 0 v64" stroke="#7ee0b8" stroke-width="2" stroke-dasharray="3 4"/>
  </g>

  <!-- conclusion -->
  <g transform="translate(320,20)">
    <rect x="-72" y="0" width="144" height="64" rx="10" fill="#253754" stroke="#8fc4ff" stroke-width="2"/>
    <circle cx="-26" cy="30" r="14" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
    <path d="M-16 40 l10 10" stroke="#8fc4ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2 22 h36 M2 30 h28 M2 38 h20" stroke="#8fc4ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- model -->
  <g transform="translate(520,20)">
    <rect x="-68" y="0" width="136" height="64" rx="10" fill="#303743" stroke="#f2c46d" stroke-width="2"/>
    <path d="M-36 42 l18 -14 18 10 18 -24" fill="none" stroke="#f2c46d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="14" r="3.5" fill="#f2c46d"/>
    <path d="M-36 14 h44" stroke="#f2c46d" stroke-width="2" stroke-dasharray="3 4"/>
  </g>

  <!-- unknown: separate, not on the beam -->
  <g transform="translate(596,150)">
    <path d="M-30 6 a12 12 0 0 1 10 -18 a14 14 0 0 1 24 -4 a12 12 0 0 1 16 10 a10 10 0 0 1 -6 14 h-32 z" fill="#2b3654" stroke="#c9b6ff" stroke-width="2"/>
    <path d="M-5 -7 a5 5 0 0 1 10 0 c0 4 -5 3 -5 7" fill="none" stroke="#c9b6ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="5" r="1.6" fill="#c9b6ff"/>
  </g>
</svg>
